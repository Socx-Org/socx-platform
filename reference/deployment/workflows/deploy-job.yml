# reference/deployment — GitHub Actions deploy job (ADR-150, ADR-040, OPS-030)
# Drop-in replacement for reference/github/workflows/ci.yml's `deploy:` stub
# job -- copy this job's content over that stub, substituting the
# {{PLACEHOLDER}} values below.
#
# Deliberately plain OpenSSH/SCP, not a third-party marketplace deploy
# action -- one fewer supply-chain dependency to trust, and it matches the
# rest of this reference implementation's point: the remote side is a
# single tested command (deploy-release.sh), not choreography this job
# needs to know about. Grounded in rms's real deploy.yml (SSH transfer of a
# built artefact) but with its nvm/raw-systemctl remote choreography
# replaced entirely by that one command.
#
# Version string satisfies OPS-030.1 (SemVer) and OPS-030.2 (traceable to an
# exact commit) simultaneously: the real git tag when deploying from one,
# otherwise 0.0.0-<short-sha> -- so an ordinary push to main doesn't need a
# formal release tag to comply.

  deploy:
    name: Deploy
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "{{ENVIRONMENT}}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so `git describe --tags` can see tags

      - name: Compute release version
        id: version
        run: |
          if git describe --tags --exact-match >/dev/null 2>&1; then
            VERSION="$(git describe --tags --exact-match)"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "Deploying version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Full install (including devDependencies) is required here -- the
      # build step needs typescript itself, which is a devDependency.
      # Pruning happens AFTER build, not before (caught during this
      # reference implementation's real on-host verification: an
      # --omit=dev install before the build step silently resolves `tsc`
      # to nothing usable and fails).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      # apps/*/package.json, not the workspace root's -- the root package.json
      # has no "type" field (only the workspace member does), and Node needs
      # a "type": "module" package.json findable by walking up from
      # apps/api/dist/index.js. Shipping the root one instead was caught
      # during this reference implementation's real on-host verification:
      # Node still ran it (module-syntax auto-detection), but with a
      # "MODULE_TYPELESS_PACKAGE_JSON" warning and a real reparse-performance
      # cost on every start -- silent, not a hard failure, exactly the kind
      # of thing worth getting right rather than shipping anyway.
      - name: Package release
        run: |
          tar -czf release.tar.gz \
            apps/*/dist \
            apps/*/package.json \
            node_modules \
            package-lock.json

      - name: Deploy to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=accept-new"
          REMOTE="${DEPLOY_USER}@${DROPLET_HOST}"
          REMOTE_TARBALL="/tmp/release-${VERSION}.tar.gz"

          scp $SSH_OPTS release.tar.gz "${REMOTE}:${REMOTE_TARBALL}"
          ssh $SSH_OPTS "$REMOTE" \
            "sudo {{DEPLOY_DIR}}/scripts/deploy-release.sh {{APP_NAME}} '${VERSION}' '${REMOTE_TARBALL}'"
          ssh $SSH_OPTS "$REMOTE" "rm -f '${REMOTE_TARBALL}'"
