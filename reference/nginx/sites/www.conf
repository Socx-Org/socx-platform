# reference/nginx — site configuration for socx-org-uk (ADR-050)
# Copy to /etc/nginx/sites-available/socx-org-uk.conf, substitute all
# {{PLACEHOLDER}} values, then:
#   ln -s ../sites-available/socx-org-uk.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Serves both the apex domain and www (CS-INF-020: socx.org.uk with www as a
# CNAME to it) — the one site file that needs two server names rather than one.
#
# Deliberately no path rewriting between this file and the app — see ghs.conf
# for the CS-INF-010 incident this structurally avoids.

server {
    listen 80;
    listen [::]:80;
    server_name {{APEX_DOMAIN}} {{WWW_DOMAIN}};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{APEX_DOMAIN}} {{WWW_DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{APEX_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{APEX_DOMAIN}}/privkey.pem;
    include /etc/nginx/snippets/tls-baseline.conf;

    access_log /var/log/nginx/socx-org-uk-access.log;
    error_log  /var/log/nginx/socx-org-uk-error.log;

    add_header X-SOCX-Environment {{ENVIRONMENT}} always;

    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
