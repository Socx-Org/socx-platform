# reference/nginx — site configuration for {{APP_NAME}} (ADR-050)
# Copy to /etc/nginx/sites-available/{{APP_NAME}}.conf, substitute all
# {{PLACEHOLDER}} values, then:
#   ln -s ../sites-available/{{APP_NAME}}.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Deliberately no path rewriting between this file and the app. CS-INF-010
# recorded a confirmed outage caused by exactly that: nginx stripped /api/
# before proxying, so Express received a path it never expected. proxy_pass
# below has no trailing path component, so the full request URI passes
# through unchanged — the app owns its own routing entirely. Do not add one.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    include /etc/nginx/snippets/tls-baseline.conf;

    access_log /var/log/nginx/{{APP_NAME}}-access.log;
    error_log  /var/log/nginx/{{APP_NAME}}-error.log;

    # Makes the environment tier identifiable at the edge (OPS-010.2),
    # complementing reference/systemd's SOCX_ENV at the process level.
    add_header X-SOCX-Environment {{ENVIRONMENT}} always;

    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
