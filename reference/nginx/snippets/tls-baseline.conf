# reference/nginx — shared TLS baseline (ADR-050)
# Included by every site file; do not duplicate these directives per-site.
# Only ssl_certificate/ssl_certificate_key are domain-specific and stay in
# each site file, since every app has its own certificate.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
# TLS 1.3 ciphers are all safe; for 1.2 the modern guidance is to let the
# client choose rather than force a server-side order.
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — resolver is Cloudflare's (1.1.1.1), matching the platform's
# existing DNS provider (CS-INF-020); replace with a different resolver only
# for a documented reason.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;

# All subdomains are ours (CS-INF-020: socx.org.uk, ghs, rms, ams), so
# includeSubDomains is safe here — it would not be if any subdomain were
# outside platform control.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
