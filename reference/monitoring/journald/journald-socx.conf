# reference/monitoring — explicit journald retention (OPS-050.5)
#
# Install as /etc/systemd/journald.conf.d/socx.conf (a drop-in override --
# never edit /etc/systemd/journald.conf directly, so this stays a single,
# reviewable file distinct from the OS default).
#
# reference/systemd routes every service's stdout/stderr to journald
# (StandardOutput=journal); without an explicit override here, retention
# is whatever the OS image's default happens to be -- undocumented and
# unreviewed, which is exactly what OPS-050.5 prohibits. This file makes
# the limit a deliberate, reviewable decision instead.
#
# Does NOT address OPS-050.6 (central aggregation off-host) -- see this
# category's README.md Purpose & Scope for why that stays an open gap
# rather than a fabricated solution.
#
# Defaults below are a reasonable starting point (500M cap, 14-day
# retention matches reference/deployment's backup-db.sh default), not an
# account-specific value -- adjust to the target host's actual disk budget
# (the real droplet has 24 GB total, ~3.3 GB used per CS-INF-020, so 500M
# is comfortable headroom, not a tight fit).

[Journal]
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=14day
